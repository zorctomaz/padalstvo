name: Osveži vremenske podatke in objavi na GitHub Pages

on:
  schedule:
    # Vsako uro. Napoved ARSO se ne spreminja tako pogosto, da bi bila
    # potrebna pogostejša osvežitev; GitHub tudi ne jamči natančne minute
    # sprožitve pri "schedule" dogodkih.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - claude/weather-forecast-mobile-app-cjwy4o
      # Ko to vejo združiš v glavno vejo (npr. main), dodaj njeno ime sem
      # (ali ga zamenjaj), da se stran gradi tudi ob vsakem push-u nanjo.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Namesti odvisnosti
        run: npm ci

      - name: Zgradi statične vremenske podatke (ARSO, opendata.si, SkyTech)
        env:
          SKYTECH_API_TOKEN: ${{ secrets.SKYTECH_API_TOKEN }}
        run: node scripts/build-data.js

      - name: Shrani osvežen ECMWF predpomnilnik (če se je spremenil)
        # data-cache/ecmwf-frames.json (glej scripts/build-data.js) se med
        # teki komitira nazaj v repo, da naslednji urni tek prepozna, ali
        # je base_time še isti in mu ni treba znova klicati ECMWF-ja (ta
        # se sicer spremeni le dvakrat na dan, build pa teče vsako uro).
        # Push z vgrajenim GITHUB_TOKEN ne sproži novega teka tega
        # workflow-a (GitHub to eksplicitno prepreči), zato ni tveganja
        # neskončne zanke.
        run: |
          if [ -n "$(git status --porcelain -- data-cache/ecmwf-frames.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data-cache/ecmwf-frames.json
            git commit -m "chore: osveži ECMWF predpomnilnik"
            git push
          else
            echo "Predpomnilnik nespremenjen, brez commit-a."
          fi

      - name: Pripravi Pages artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Objavi na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
